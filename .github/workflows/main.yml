name: CI

on:
  # Triggers the workflow on push or pull request events
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Install
        run: |
          pip install --upgrade pip
          pip install .[test]
      - name: Collect ENSDF archives
        run: python -m pyradiate.tools.ensdf.lib_updater
      - name: Test
        run: pytest
      - name: Rebuild NIST archives
        run: |
          python -m pyradiate.tools.nist.lib_builder
          pytest tests/tools/test_nist.py
